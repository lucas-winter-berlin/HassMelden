<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101210">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d7b56a'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='18' fill='%23231c10'%3EK%3C/text%3E%3C/svg%3E">
  <title>Kontor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">
  <a class="skip" href="#screen">Zum Inhalt</a>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span>
          <span class="brand-name">Kontor</span>
          <span class="brand-sub">Stand 5. Oktober 2026</span>
        </span>
      </div>
      <nav id="nav" aria-label="Bereiche"></nav>
      <div class="who">
        <span class="av av-user" aria-hidden="true">I</span>
        <span>
          <strong>Iku</strong>
          <small>Persönliches Ledger</small>
        </span>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Menü öffnen"></button>
        <button type="button" class="search-btn" id="search-btn" aria-haspopup="dialog" aria-controls="palette">
          <span class="search-ico" aria-hidden="true"></span>
          <span class="search-label">Suchen oder springen</span>
          <kbd id="search-kbd">Strg K</kbd>
        </button>
        <div class="top-actions">
          <button type="button" class="range-btn" id="range-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="range-pop">
            <span id="range-label">1. Okt. – 5. Okt. 2026</span>
          </button>
          <div class="pill" id="context-pill" role="radiogroup" aria-label="Kontext">
            <button type="button" role="radio" data-ctx="alle" aria-checked="true">Alle</button>
            <button type="button" role="radio" data-ctx="privat" aria-checked="false">Privat</button>
            <button type="button" role="radio" data-ctx="arbeit" aria-checked="false">Arbeit</button>
            <button type="button" role="radio" data-ctx="selbst" aria-checked="false">Selbstständig</button>
          </div>
          <button type="button" class="icon-btn" id="privacy-btn" aria-pressed="false" aria-label="Beträge verbergen"></button>
          <button type="button" class="icon-btn" id="theme-btn" aria-label="Helles Design einschalten"></button>
        </div>
      </header>
      <div id="range-pop" class="popover" hidden role="dialog" aria-label="Zeitraum"></div>
      <main id="screen" tabindex="-1"></main>
    </div>
  </div>

  <div id="palette" class="overlay" hidden>
    <div class="palette" role="dialog" aria-modal="true" aria-label="Befehlspalette">
      <input id="palette-input" type="text" placeholder="Seiten, Händler, Aktionen" aria-controls="palette-list" aria-autocomplete="list" autocomplete="off">
      <ul id="palette-list" role="listbox"></ul>
      <p class="palette-foot">Eingabetaste öffnet · Esc schließt</p>
    </div>
  </div>

  <div id="rule-overlay" class="overlay center" hidden>
    <form class="dialog" id="rule-form" role="dialog" aria-modal="true" aria-labelledby="rule-title">
      <h2 id="rule-title">Regel erstellen</h2>
      <p class="lede">Wenn der Händler den Text enthält, schlägt Kontor Kategorie und Kontext vor.</p>
      <label class="field">Händler enthält
        <input id="rule-merchant" name="merchant" required autocomplete="off">
      </label>
      <div class="field-row">
        <label class="field">Kategorie
          <select id="rule-category" name="category"></select>
        </label>
        <label class="field">Kontext
          <select id="rule-context" name="context"></select>
        </label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn" id="rule-cancel">Abbrechen</button>
        <button type="submit" class="btn btn-primary">Regel speichern</button>
      </div>
    </form>
  </div>

  <div id="menu" class="menu" hidden role="menu"></div>
  <div id="toasts" aria-live="polite" aria-relevant="additions"></div>
  <script src="ledger.js"></script>
  <script src="app.js"></script>
</body>
</html>
